# Per-source configuration. Keep URLs and partition keys here so we can
# tweak windows without touching code.

bls_qcew:
  # See src/eia/sources/bls_qcew.py for the two pull modes (by_area vs singlefile).
  default_year: 2023
  default_quarter: 3   # Q3 = July-Sept; finalized ~6 months after quarter close
  # Phase 0 'by_area' mode hits a small set of counties for fast iteration.
  phase0_counties:
    - "06073"   # San Diego, CA — anchor for the exit query
    - "36061"   # New York, NY (Manhattan)
    - "17031"   # Cook, IL (Chicago)
    - "48201"   # Harris, TX (Houston)
    - "06037"   # Los Angeles, CA
  # Phase 1 'singlefile' mode pulls all ~3,000 US counties for these years.
  # Driven by pipelines/phase1_bls_qcew.py (loops year x quarter; per-year zip
  # is reused across the four quarters of that year).
  phase1_years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
  phase1_quarters: [1, 2, 3, 4]

bea_io:
  # BEA Input-Output Use & Make tables — XLS bundles (annual)
  # https://www.bea.gov/industry/input-output-accounts-data
  use_url: "https://apps.bea.gov/industry/iTables%20Static%20Files/AllTablesIO.zip"
  default_year: 2023

census_acs:
  # Census ACS 5-year via the data API.
  # https://api.census.gov/data.html
  base_url: "https://api.census.gov/data"
  default_end_year: 2023
  variables:
    # See https://api.census.gov/data/2023/acs/acs5/variables.html
    population: "B01003_001E"
    median_household_income: "B19013_001E"
    median_age: "B01002_001E"
    bachelors_count: "B15003_022E"   # plus 023, 024, 025 for "or higher"
    bachelors_master: "B15003_023E"
    bachelors_prof:   "B15003_024E"
    bachelors_doctor: "B15003_025E"
    population_25_plus: "B15003_001E"
  states:
    # Phase 1: all 50 states plus DC. (Phase 0 was "06" / California only.)
    - "01"  # Alabama
    - "02"  # Alaska
    - "04"  # Arizona
    - "05"  # Arkansas
    - "06"  # California
    - "08"  # Colorado
    - "09"  # Connecticut
    - "10"  # Delaware
    - "11"  # District of Columbia
    - "12"  # Florida
    - "13"  # Georgia
    - "15"  # Hawaii
    - "16"  # Idaho
    - "17"  # Illinois
    - "18"  # Indiana
    - "19"  # Iowa
    - "20"  # Kansas
    - "21"  # Kentucky
    - "22"  # Louisiana
    - "23"  # Maine
    - "24"  # Maryland
    - "25"  # Massachusetts
    - "26"  # Michigan
    - "27"  # Minnesota
    - "28"  # Mississippi
    - "29"  # Missouri
    - "30"  # Montana
    - "31"  # Nebraska
    - "32"  # Nevada
    - "33"  # New Hampshire
    - "34"  # New Jersey
    - "35"  # New Mexico
    - "36"  # New York
    - "37"  # North Carolina
    - "38"  # North Dakota
    - "39"  # Ohio
    - "40"  # Oklahoma
    - "41"  # Oregon
    - "42"  # Pennsylvania
    - "44"  # Rhode Island
    - "45"  # South Carolina
    - "46"  # South Dakota
    - "47"  # Tennessee
    - "48"  # Texas
    - "49"  # Utah
    - "50"  # Vermont
    - "51"  # Virginia
    - "53"  # Washington
    - "54"  # West Virginia
    - "55"  # Wisconsin
    - "56"  # Wyoming

tiger:
  # TIGER/Line county shapefiles
  # https://www2.census.gov/geo/tiger/TIGER<year>/COUNTY/
  default_year: 2023

hud_crosswalk:
  # HUD USPS ZIP-County crosswalk (residential weights)
  # https://www.huduser.gov/portal/datasets/usps_crosswalk.html
  # NOTE: their portal requires a free signup for direct CSV downloads;
  # we mirror the latest snapshot via a community mirror in Phase 0,
  # and switch to the official portal once API key is added.
  default_quarter: "2024Q1"

setlistfm:
  # Phase 1 scale: 2022 across all 50 states + DC.
  # Each state-year partition is capped at 10,000 results by the API; big
  # states (CA/NY/TX) saturate (logged as WARNING). Cap-busting subdivision
  # is a future optimization — at 50 states it's still ~200K+ setlists.
  country_code: "US"
  default_years: [2022]
  default_states: [
    "AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL",
    "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME",
    "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH",
    "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI",
    "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY",
  ]
  requests_per_second: 1.0
  page_size: 20  # Setlist.fm fixes this; informational only.
  max_pages_per_partition: 500  # 500 * 20 = 10,000 — the API's hard cap.
