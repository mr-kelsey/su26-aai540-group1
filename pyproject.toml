[project]
name = "eia"
version = "0.1.0"
description = "ML-based Economic Impact Assessment for social events"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "USD AAI-540 Group 1" },
]
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
    "geopandas>=1.0.0",
    "requests>=2.32.0",
    "fastexcel>=0.20.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
]
notebook = [
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
eia = "eia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eia"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/eia --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
